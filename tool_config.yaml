tools:
  - class_name: verl.tools.search_tool.SearchTool
    tool_schema:
      type: function
      function:
        name: search
        description: Search for relevant information
        parameters:
          type: object
          properties:
            query_list:
              type: array
              items:
                type: string
              description: List of search queries
          required:
            - query_list
    config:
      type: NATIVE
      retrieval_service_url: "http://127.0.0.1:8000/retrieve"
      topk: 3
      num_workers: 120
      rate_limit: 120
      timeout: 30
